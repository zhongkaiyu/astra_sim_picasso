topology: [ FullyConnected ]
npus_count: [ 4 ]
bandwidth: [ 400.0 ]  # GB/s (NVLink 4.0: ~400 GB/s per GPU)
latency: [ 900.0 ]    # ns (intra-node latency ~900ns)

# ============================================================================
# All-to-All Network Topology (4 H100 GPUs - Fully Connected)
# ============================================================================
#
# Physical Topology:
#       GPU0 ???? GPU1
#        ?  ?   ?
#       GPU2 ???? GPU3
#
# All GPUs are fully connected (all-to-all)
# Each GPU can communicate with any other GPU directly
#
# ============================================================================
# Hardware Specifications: NVIDIA H100 SXM5 80GB
# ============================================================================
#
# NVLink Configuration:
# - NVLink 4.0 Generation
# - 18 NVLink lanes per GPU @ 50 GB/s per lane (bidirectional)
# - Total NVLink bandwidth per GPU: 900 GB/s (bidirectional aggregate)
# - Effective per-direction bandwidth: ~400 GB/s
# - Fully connected topology (all-to-all)
#
# Memory Subsystem:
# - HBM3e memory: 80 GB per GPU
# - Memory bandwidth: 3350 GB/s (~3.35 TB/s) per GPU
#
# Compute Performance:
# - FP16/BF16 Tensor Core: 989 TFLOPS
# - FP32: 67 TFLOPS
# - INT8: 1979 TOPS
#
# Network Latency:
# - GPU-to-GPU (direct): ~900 ns
# - All-to-All provides minimum latency (no intermediate hops)
#
# ============================================================================
# Usage Notes:
# ============================================================================
# - This network config supports both TP and DP with 4 GPUs
# - TP=4: All 4 GPUs work on same data (model parallelism)
# - DP=4: Each GPU works on different data (data parallelism)
# - Fully connected topology is optimal for both patterns
# - No network congestion for small-scale (4 GPUs)
# ============================================================================

