# Sparse Mesh2D Topology with ONE-RING SNAKE PATTERN (2x1)
#
# Layout:
#     0 --- 1
#
# Ring order: 0¡ú1¡ú0
#
topology: [ Mesh2D ]  # Auto-converted to SparseMesh2D when npu_placement is present

npus_count: [ 2 ]
bandwidth: [ 400 ]
latency: [ 900 ]

# Grid dimensions
width: 2
height: 1

# Custom NPU placement: [ [column, row, npu_id], ... ]
npu_placement: [
  [0, 0, 0], [1, 0, 1]
]

