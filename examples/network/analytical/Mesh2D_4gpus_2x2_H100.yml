# ============================================================================
# Mesh2D Network Topology (4 H100 GPUs - 2x2 Grid)
# ============================================================================
#
# Physical Topology (2 columns × 2 rows):
#
#     GPU0 --- GPU1
#      |        |
#     GPU2 --- GPU3
#
# width = 2 (columns), height = 2 (rows)
# Total NPUs = width × height = 2 × 2 = 4
#
# 连接关系：
# - GPU0 连接: GPU1 (右), GPU2 (下)
# - GPU1 连接: GPU0 (左), GPU3 (下)
# - GPU2 连接: GPU0 (上), GPU3 (右)
# - GPU3 连接: GPU2 (左), GPU1 (上)
#
# ============================================================================
# Hardware Specifications: NVIDIA H100 SXM5 80GB
# ============================================================================
#
# NVLink Configuration:
# - NVLink 4.0 Generation
# - 18 NVLink lanes per GPU @ 50 GB/s per lane (bidirectional)
# - Total NVLink bandwidth per GPU: 900 GB/s (bidirectional aggregate)
# - Effective per-direction bandwidth: ~400 GB/s
# - Mesh2D topology (each GPU connected to 2-4 neighbors)
#
# Memory Subsystem:
# - HBM3e memory: 80 GB per GPU
# - Memory bandwidth: 3350 GB/s (~3.35 TB/s) per GPU
#
# Compute Performance:
# - FP16/BF16 Tensor Core: 989 TFLOPS
# - FP32: 67 TFLOPS
# - INT8: 1979 TOPS
#
# Network Latency:
# - GPU-to-GPU (adjacent): ~900 ns (1 hop)
# - GPU-to-GPU (diagonal): ~1800 ns (2 hops)
#
# ============================================================================
# 路由特性 (Routing Characteristics):
# ============================================================================
#
# 跳数 (Hop Count):
# - 1 hop: 相邻 GPU (GPU0↔GPU1, GPU0↔GPU2, GPU1↔GPU3, GPU2↔GPU3)
# - 2 hops: 对角 GPU (GPU0↔GPU3, GPU1↔GPU2)
#
# 示例路由路径：
# - GPU0 → GPU1: 直连 (1 hop)
# - GPU0 → GPU2: 直连 (1 hop)
# - GPU0 → GPU3: GPU0 → GPU1 → GPU3 或 GPU0 → GPU2 → GPU3 (2 hops)
# - GPU1 → GPU2: GPU1 → GPU0 → GPU2 或 GPU1 → GPU3 → GPU2 (2 hops)
#
# ============================================================================
# Parallelism Mapping:
# ============================================================================
#
# TP=4 (Tensor Parallel):
# - TP Group: [GPU0, GPU1, GPU2, GPU3]
# - 所有 GPU 处理同一批数据的不同模型分片
# - 通信模式: AllReduce, AllGather 需要跨越 1-2 hops
#
# DP=4 (Data Parallel):
# - DP Group 0: GPU0 (数据批次 0)
# - DP Group 1: GPU1 (数据批次 1)
# - DP Group 2: GPU2 (数据批次 2)
# - DP Group 3: GPU3 (数据批次 3)
# - 通信模式: AllReduce 梯度同步需要跨越 1-2 hops
#
# DP=2, TP=2 (混合并行):
# - DP Group 0 (TP=2): [GPU0, GPU1] - 处理数据批次 0
# - DP Group 1 (TP=2): [GPU2, GPU3] - 处理数据批次 1
# - TP 通信: GPU0↔GPU1 和 GPU2↔GPU3 (1 hop, 行内)
# - DP 通信: (GPU0,GPU1) ↔ (GPU2,GPU3) (1-2 hops, 跨行)
#
# ============================================================================
# Mesh2D vs All-to-All 对比:
# ============================================================================
#
# Mesh2D (本配置):
# - 每个 GPU 有 2-3 条物理连接
# - 最大跳数: 2 hops
# - 硬件成本: 低 (4 条双向链路)
# - 适用场景: 实际硬件部署，资源受限环境
#
# All-to-All (FullyConnected):
# - 每个 GPU 有 3 条物理连接（连接到其他所有 GPU）
# - 最大跳数: 1 hop (直连)
# - 硬件成本: 高 (6 条双向链路)
# - 适用场景: 理想性能基准测试
#
# ============================================================================
# 通信性能特性:
# ============================================================================
#
# 带宽竞争 (Bandwidth Contention):
# - 同时通信时可能产生链路竞争
# - 例如: 如果 GPU0→GPU1 和 GPU2→GPU3 同时通信，无竞争
# - 但如果 GPU0→GPU3 和 GPU1→GPU2 同时通信，会在中间节点产生竞争
#
# 最优通信模式:
# - 行内通信 (GPU0↔GPU1, GPU2↔GPU3): 1 hop, 无竞争
# - 列内通信 (GPU0↔GPU2, GPU1↔GPU3): 1 hop, 无竞争
# - 对角通信 (GPU0↔GPU3, GPU1↔GPU2): 2 hops, 可能竞争
#
# ============================================================================
# Usage Notes:
# ============================================================================
# - Mesh2D 拓扑比 All-to-All 更接近真实硬件
# - TP 组应该映射到相邻 GPU（最小化跳数）
# - 适合研究网络拓扑对性能的影响
# - 可用于验证 congestion-aware 路由算法
# ============================================================================

