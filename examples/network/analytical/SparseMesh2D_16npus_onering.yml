# Sparse Mesh2D Topology with ONE-RING SNAKE PATTERN (4x4)
#
# This layout keeps ring neighbors physically adjacent by zig-zag mapping.
#
# Snake Layout (4x4):
#
#     0 --- 1 --- 2 --- 3
#     |     |     |     |
#     7 --- 6 --- 5 --- 4   (reversed row)
#     |     |     |     |
#     8 --- 9 --- 10--- 11
#     |     |     |     |
#     15--- 14--- 13--- 12  (reversed row)
#
# Ring order: 0¡ú1¡ú2¡ú3¡ú4¡ú5¡ú6¡ú7¡ú8¡ú9¡ú10¡ú11¡ú12¡ú13¡ú14¡ú15¡ú0
#
topology: [ Mesh2D ]  # Auto-converted to SparseMesh2D when npu_placement is present

npus_count: [ 16 ]
bandwidth: [ 400 ]
latency: [ 1 ]

# Grid dimensions
width: 4
height: 4

# Custom NPU placement: [ [column, row, npu_id], ... ]
npu_placement: [
  # Row 0: left-to-right (0 ¡ú 3)
  [0, 0, 0], [1, 0, 1], [2, 0, 2], [3, 0, 3],

  # Row 1: right-to-left (4 ¡ú 7)
  [3, 1, 4], [2, 1, 5], [1, 1, 6], [0, 1, 7],

  # Row 2: left-to-right (8 ¡ú 11)
  [0, 2, 8], [1, 2, 9], [2, 2, 10], [3, 2, 11],

  # Row 3: right-to-left (12 ¡ú 15)
  [3, 3, 12], [2, 3, 13], [1, 3, 14], [0, 3, 15]
]

